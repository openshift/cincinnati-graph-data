to: 4.20.31
from: ^4[.]19[.].*$
fixedIn: 4.20.32
url: https://redhat.atlassian.net/browse/MCO-2489
name: AutoSizingReservedDisabledSilently
message: |
  The autoSizingReserved feature that was explicitly enabled by the cluster admin for custom MachineConfigPools gets silently disabled after upgrade.
matchingRules:
- type: PromQL
  promql:
    promql: |
      group(max_over_time(apiserver_storage_objects{resource="kubeletconfigs.machineconfiguration.openshift.io"}[1h]) > 0)
      or
      0 * group(max_over_time(apiserver_storage_objects[1h]))
