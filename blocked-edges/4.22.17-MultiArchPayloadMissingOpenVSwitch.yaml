to: 4.22.17
from: 4[.]21[.].*[+].*
url: https://redhat.atlassian.net/browse/MCO-2603
name: MultiArchPayloadMissingOpenVSwitch
message: |
  Standalone clusters using the multi-arch release payload will have nodes enter a permanent NotReady state after the node update, because the RHCOS 9.8.20260915-0 image omits the Open vSwitch binaries.
matchingRules:
- type: PromQL
  promql:
    promql: |
      0 * group by (_id, invoker) (cluster_installer{_id="",invoker="hypershift"})
      or
      group by (_id, invoker) (cluster_installer{_id=""})
