name: VSphereConfigCloudControllerCrash
message: |
  On vSphere clusters whose Infrastructure spec.platformSpec.vsphere exists but has empty vcenters and failureDomains fields, updating causes cloud-controller-manager to crash, stopping node lifecycle management.
matchingRules:
- type: PromQL
  promql:
    promql: |
      group(cluster_infrastructure_provider{_id="",type="VSphere"})
      or
      0 * group(cluster_infrastructure_provider{_id=""})
